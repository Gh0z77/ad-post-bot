services:
  - type: worker
    name: telegram-broadcast-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: FOUNDER_USERNAME
        value: dior_coder
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
